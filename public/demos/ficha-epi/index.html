<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ficha de EPI — Controle de entrega de EPI · Demonstração NOLTH</title>
  <meta name="description" content="Fichas de entrega de EPI com assinatura na tela, controle de trocas, estoque e kit de EPIs por função.">
  <meta name="theme-color" content="#1f2a37">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topo">
    <a href="#/" class="marca">
      <img src="icons/icon.svg" alt="" width="34" height="34">
      <span>Ficha de <b>EPI</b></span>
    </a>
    <a href="#/conta" class="status-nuvem" id="statusNuvem" hidden></a>
    <nav class="menu" aria-label="Principal">
      <a href="#/" data-rota="painel"><span class="ic" aria-hidden="true">📊</span><span>Painel</span></a>
      <a href="#/fichas" data-rota="lista"><span class="ic" aria-hidden="true">🗂️</span><span>Fichas</span></a>
      <a href="#/colaboradores" data-rota="colaboradores"><span class="ic" aria-hidden="true">👥</span><span>Colaboradores</span></a>
      <a href="#/epis" data-rota="epis"><span class="ic" aria-hidden="true">🦺</span><span>EPIs</span></a>
      <a href="#/funcoes" data-rota="funcoes"><span class="ic" aria-hidden="true">👷</span><span>Funções</span></a>
      <a href="#/backup" data-rota="dados"><span class="ic" aria-hidden="true">💾</span><span>Dados</span><span class="badge" id="contaLixeira" hidden title="Fichas na lixeira"></span></a>
    </nav>
  </header>

  <main id="app" tabindex="-1"></main>

  <footer class="rodape">
    Modelo de apoio para o registro de entrega de EPI. Adapte à realidade da empresa e valide com o profissional de SST responsável.
  </footer>

  <div id="toast" role="status" aria-live="polite"></div>
  <div id="impressao" aria-hidden="true"></div>

  <script src="app.js"></script>
  <script src="gestao.js"></script>
  <script src="config.js"></script>
  <script src="demo-seed.js"></script>
  <script src="vendor/supabase.js"></script>
  <script src="nuvem.js"></script>

<!-- Faixa de demonstração NOLTH -->
<div id="nolth-demo-bar" style="position:fixed;left:12px;bottom:12px;z-index:70;display:flex;align-items:center;gap:8px;max-width:calc(100vw - 24px);padding:8px 12px;border-radius:12px;background:rgba(16,21,34,.92);color:#F1F3F8;font:600 12px/1.3 system-ui,sans-serif;box-shadow:0 0 0 1px rgba(59,227,240,.45),0 8px 24px rgba(0,0,0,.35)">
  <span style="width:7px;height:7px;flex:none;border-radius:50%;background:#3BE3F0;box-shadow:0 0 8px #3BE3F0"></span>
  <span>Demonstração NOLTH · sem login, os dados ficam só neste navegador</span>
  <button type="button" id="nolth-demo-reset" style="flex:none;padding:5px 9px;border-radius:8px;border:1px solid rgba(255,255,255,.2);background:transparent;color:#F1F3F8;font:inherit;cursor:pointer">Restaurar exemplos</button>
</div>
<script>
document.getElementById("nolth-demo-reset").addEventListener("click", function () {
  if (!confirm("Restaurar os dados de exemplo? O que você alterou nesta demonstração será apagado.")) return;
  Object.keys(localStorage).filter(function (k) { return k.indexOf("fichaEpi.") === 0 }).forEach(function (k) { localStorage.removeItem(k) });
  location.hash = ""; location.reload();
});
</script>
</body>
</html>
